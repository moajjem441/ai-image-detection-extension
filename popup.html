<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      font-family: Arial, sans-serif;
      padding: 12px;
      margin: 0;
      text-align: center;
      background: #fafafa;
    }
    h4 {
      margin: 0 0 10px 0;
      color: #202124;
    }
    input {
      width: 90%;
      padding: 7px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    button {
      width: 96%;
      padding: 8px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    button:disabled {
      background-color: #9aa0a6;
      cursor: not-allowed;
    }
    #previewImg {
      max-width: 100%;
      max-height: 140px;
      border-radius: 4px;
      margin-top: 10px;
      display: none;
      object-fit: cover;
    }
    #resultBox {
      margin-top: 10px;
      display: none;
    }
    .hint {
      font-size: 11px;
      color: #5f6368;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h4>AI Image Detector</h4>
  <input type="text" id="imageUrl" placeholder="Paste image URL here..." />
  <button id="checkBtn">Check Image</button>

  <img id="previewImg" alt="Image Preview" />
  <div id="resultBox"></div>

  <p class="hint">Or right-click any web image and select "Check with AI Detector".</p>

  <script src="popup.js"></script>
</body>
</html>
